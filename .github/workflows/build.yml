name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      REPO:
        description: 'Kernel repository'
        default: 'EnZon-1928/a235f_osrc.git'
        required: true
      BRANCH:
        description: 'Kernel branch'
        default: 'main'
        required: true
      DEVICE_TARGET:
        description: 'Target device to build'
        default: 'A235F'
        required: true
      DEFCONFIG:
        description: 'Defconfig name'
        required: true
        default: 'a23_eur_open_defconfig'
      ZIP_NAME:
        description: 'Custom ZIP name'
        required: false
        default: 'ZharVe1L'
        type: string
      LTO:
        description: 'Link Time Optimization'
        required: true
        default: 'thin'
        type: choice
        options:
          - none
          - thin
      CLANG_VERSION:
        description: 'Clang compiler'
        required: true
        default: 'aosp-12'
        type: choice
        options:
          - neutron-clang23
          - aosp-23
          - aosp-22
          - aosp-21
          - aosp-20
          - aosp-12
      SELINUX:
        description: 'SELinux mode'
        required: true
        default: 'enforcing'
        type: choice
        options:
          - enforcing
          - permissive
      KSU:
        description: 'Add KernelSU support'
        type: boolean
        default: false
      KSU_BRANCH:
        description: 'KernelSU branch'
        required: false
        default: 'xxksu'
      KCFLAGS_W:
        description: 'Enable KCFLAGS=-w'
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Set Timezone
      run: sudo ln -sf /usr/share/zoneinfo/Asia/Jakarta /etc/localtime

    - uses: actions/checkout@v5
      with:
        fetch-depth: 1

    - name: Clone kernel source
      if: github.event.inputs.UPDATE_TOOLCHAIN != 'true'
      run: git clone --depth=1 --single-branch -b ${{ github.event.inputs.BRANCH }} --recursive https://github.com/${{ github.event.inputs.REPO }} kernel_root
        
    - name: Cache Toolchain
      id: cache-toolchain
      uses: actions/cache@v5
      with:
        path: |
          ~/neutron-clang
          ~/androidcc
        key: clang-${{ github.event.inputs.CLANG_VERSION }}-${{ github.sha }}
        restore-keys: |
          clang-${{ github.event.inputs.CLANG_VERSION }}-
          clang-

    - name: Cache ccache
      uses: actions/cache@v5
      with:
        path: ~/.ccache
        key: ccache-kernel-${{ github.sha }}
        restore-keys: ccache-kernel-

    - name: Prepare Dependencies
      run: chmod +x ./build.sh && bash ./build.sh --setup-deps

    - name: Setup Build Environment
      if: github.event.inputs.UPDATE_TOOLCHAIN != 'true'
      id: buildKernel
      run: |
        cd kernel_root
        gitsha1=$(git rev-parse --short HEAD)
        CODENAME=$(cat ../codename 2>/dev/null || echo "kernel")
        KERNEL_VER=$(make kernelversion 2>/dev/null || echo "unknown")
        if [ -n "${{ github.event.inputs.ZIP_NAME }}" ]; then
          buildDetails="${{ github.event.inputs.ZIP_NAME }}"
        else
          buildDetails="$CODENAME-$KERNEL_VER-$gitsha1"
        fi
        echo "buildDetails=$buildDetails" >> $GITHUB_OUTPUT

    - name: Fetch Toolchains
      if: ${{ steps.cache-toolchain.outputs.cache-hit != 'true' || github.event.inputs.UPDATE_TOOLCHAIN == 'true' }}
      env:
        UPDATE_TOOLCHAINS: ${{ github.event.inputs.UPDATE_TOOLCHAIN }}
        CLANG_VERSION: ${{ github.event.inputs.CLANG_VERSION }}
      run: bash ./build.sh --fetch-toolchains

    - name: Build Kernel
      if: github.event.inputs.UPDATE_TOOLCHAIN != 'true'
      env:
        BRANCH: ${{ github.event.inputs.BRANCH }}
        DEVICE_TARGET: ${{ github.event.inputs.DEVICE_TARGET }}
        DEFCONFIG: ${{ github.event.inputs.DEFCONFIG }}
        LTO: ${{ github.event.inputs.LTO }}
        KSU: ${{ github.event.inputs.KSU }}
        SELINUX: ${{ github.event.inputs.SELINUX }}
        CLANG_VERSION: ${{ github.event.inputs.CLANG_VERSION }}
        CI_ZIPNAME: "${{ steps.buildKernel.outputs.buildDetails }}.zip"
        KCFLAGS_W: "${{ github.event.inputs.KCFLAGS_W }}"
      run: |
        cd kernel_root
        mkdir -p ~/.ccache
        
        # Handle KernelSU
        if [[ "$KSU" == "true" ]]; then
          device_defconfig="arch/arm64/configs/${{ inputs.DEFCONFIG }}"
          echo "INFO: Injecting KernelSU support..."
          curl -LSs "https://raw.githubusercontent.com/RapliVx/KernelSU/xxksu/kernel/setup.sh" | bash -s "${{ inputs.KSU_BRANCH }}"
          
          echo "CONFIG_KSU=y" >> $device_defconfig
          echo "CONFIG_KSU_DEBUG=n" >> $device_defconfig
          echo "CONFIG_KSU_TOOLKIT=n" >> $device_defconfig
          echo "CONFIG_KSU_EXTRAS=n" >> $device_defconfig
          echo "CONFIG_KSU_TAMPER_SYSCALL_TABLE=n" >> $device_defconfig
          
          if ! grep -q "CONFIG_KSU_TAMPER_SYSCALL_TABLE" "$device_defconfig"; then
            echo "ERROR: Failed to append KernelSU defconfig."
            exit 1
          fi
          echo "INFO: KernelSU module injected successfully."
        fi
        
        echo "INFO: Initializing kernel build..."
        bash ../build.sh

    - name: Upload Kernel Artifacts
      uses: actions/upload-artifact@v5
      with:
        name: Kernel-${{ steps.buildKernel.outputs.buildDetails }}
        path: "*.zip"
