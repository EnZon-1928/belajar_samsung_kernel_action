name: Build Kernel
on:
  workflow_dispatch:
    inputs:
      REPO:
        description: 'Kernel repository'
        default: 'IsaacCodesStuff/MizKernel-A235F.git'
        required: true
      BRANCH:
        description: 'Kernel branch'
        default: 'main'
        required: true
      DEVICE_TARGET:
        description: 'Target device to build'
        default: 'a23nsxx'
        required: true
      DEFCONFIG:
        description: 'Defconfig name'
        required: true
        default: 'a23_eur_open_defconfig'
      LTO:
        description: 'Link Time Optimisation'
        required: true
        default: 'thin'
        type: choice
        options:
          - none
          - thin
          - full
      KSU:
        description: 'Add KernelSU support'
        type: boolean
        default: false
      KSU_BRANCH:
        description: 'KernelSU branch'
        required: true
        default: 'xxksu'
      KCFLAGS_W:
        description: 'Enable KCFLAGS=-w'
        type: boolean
        default: true
      SELINUX_MODE:
        description: 'SELinux mode'
        required: true
        default: 'enforcing'
        type: choice
        options:
          - enforcing
          - permissive

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Set Timezone
      run: sudo ln -sf /usr/share/zoneinfo/Asia/Jakarta /etc/localtime

    - uses: actions/checkout@v5
      with:
        fetch-depth: 1

    - name: Clone kernel source
      if: github.event.inputs.UPDATE_TOOLCHAIN != 'true'
      run: git clone --depth=1 --single-branch -b ${{ github.event.inputs.BRANCH }} https://github.com/${{ github.event.inputs.REPO }} kernel_root
        
    - name: Cache Toolchain
      id: cache-toolchain
      uses: actions/cache@v5
      with:
        path: ~/neutron-clang
        key: neutron-clang-23

    - name: Cache ccache
      uses: actions/cache@v5
      with:
        path: ~/.ccache
        key: ccache-kernel-${{ github.sha }}
        restore-keys: ccache-kernel-

    - name: Prepare Dependencies
      run: |
        # 1. Hapus paksa semua repo Google dengan wildcard
        sudo rm -rf /etc/apt/sources.list.d/google*.list
        sudo apt-get clean
        
        # 2. Suntik jurus kebal (|| true) ke dalam build.sh agar tidak mati saat error
        sed -i 's/sudo apt update -y/sudo apt update -y || true/g' ./build.sh
        
        # 3. Eksekusi
        chmod +x ./build.sh && bash ./build.sh --setup-deps
        
    - name: Setup Build Environment
      if: github.event.inputs.UPDATE_TOOLCHAIN != 'true'
      id: buildKernel
      run: |
        cd kernel_root
        gitsha1=$(git rev-parse --short HEAD)
        CODENAME=$(cat ../codename 2>/dev/null || echo "kernel")
        KERNEL_VER=$(make kernelversion 2>/dev/null || echo "unknown")
        SELINUX_MODE=${{ github.event.inputs.SELINUX_MODE }}
        echo "buildDetails=$CODENAME-$KERNEL_VER-$gitsha1-${SELINUX_MODE}-$(date +%Y%m%d)" >> $GITHUB_OUTPUT
        echo "currDate=$(date)" >> $GITHUB_OUTPUT
        echo "kernelVer=$KERNEL_VER" >> $GITHUB_OUTPUT
        echo "gitsha=$gitsha1" >> $GITHUB_OUTPUT

    - name: 2.5. Operasi Bedah Presisi (Fix Kconfig, stat.c & bpf_trace.c)
      run: |
        cd kernel_root
        # 1. Pecat gcc-wrapper.py dari Makefile
        sed -i 's/$(PYTHON) $(srctree)\/scripts\/gcc-wrapper.py //g' Makefile
        
        # 2. Sapu bersih sisa Git Conflict di file Kconfig
        sed -i '/<<<<<<</d; /=======/d; />>>>>>>/d' init/Kconfig
        sed -i '/<<<<<<</d; /=======/d; />>>>>>>/d' kernel/trace/Kconfig
        sed -i '/<<<<<<</d; /=======/d; />>>>>>>/d' lib/Kconfig.debug
        
        # 3. FIX BPF_TRACE: Hapus 1 blok penuh Monster Git secara presisi
        # Menghapus dari baris "<<<<<<< HEAD" sampai ke baris ">>>>>>>"
        sed -i '/<<<<<<< HEAD/,/>>>>>>>/d' kernel/trace/bpf_trace.c
        
        # 4. FIX STAT.C: Jahit ulang luka dari KernelSU
        # a. Ubah huruf 'q' yang nyasar menjadi '#endif'
        sed -i 's/^[[:space:]]*q[[:space:]]*$/#endif/g' fs/stat.c
        # b. Hapus baris if() yang cacat/terpotong (yang berakhiran AT_NO_AUTOMOUNT | )
        sed -i '/AT_NO_AUTOMOUNT |/d' fs/stat.c
        sed -i '/CONFIG_GCC_VERSION/d' arch/arm64/configs/vendor/${{ github.event.inputs.DEFCONFIG }}
        sed -i '/CONFIG_CC_IS_CLANG/d' arch/arm64/configs/vendor/${{ github.event.inputs.DEFCONFIG }}
        sed -i '/CONFIG_CLANG_VERSION/d' arch/arm64/configs/vendor/${{ github.event.inputs.DEFCONFIG }}

        # 4. Suntik paksa pengenalan Clang ke dalam build.sh (posisi file ada di luar kernel_root)
        sed -i 's/ARCH=arm64/ARCH=arm64 CC=clang CXX=clang++/' ../build.sh
        chmod +x scripts/config
        sed -i '1i #ifndef NOHZ_KICK_MASK\n#define NOHZ_KICK_MASK (NOHZ_BALANCE_KICK | NOHZ_STATS_KICK)\n#endif' kernel/sched/core.c

    - name: Fetch Toolchains
      if: ${{ steps.cache-toolchain.outputs.cache-hit != 'true' || github.event.inputs.UPDATE_TOOLCHAIN == 'true' }}
      env:
        UPDATE_TOOLCHAINS: ${{ github.event.inputs.UPDATE_TOOLCHAIN }}
      run: bash ./build.sh --fetch-toolchains

    - name: Build Kernel
      if: github.event.inputs.UPDATE_TOOLCHAIN != 'true'
      env:
        BRANCH: ${{ github.event.inputs.BRANCH }}
        TG_TOKEN: ${{ secrets.BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.CHAT_ID }}
        DEVICE_TARGET: ${{ github.event.inputs.DEVICE_TARGET }}
        DEFCONFIG: ${{ github.event.inputs.DEFCONFIG }}
        LTO: ${{ github.event.inputs.LTO }}
        KSU: ${{ github.event.inputs.KSU }}
        CI_ZIPNAME: "${{ steps.buildKernel.outputs.buildDetails }}.zip"
        KCFLAGS_W: "${{ github.event.inputs.KCFLAGS_W }}"
        SELINUX_MODE: "${{ github.event.inputs.SELINUX_MODE }}"
      run: |
        cd kernel_root
        if [ ! -d ~/.ccache ]; then
          mkdir -p ~/.ccache
        fi
        # Handle KSU
        if [[ "$KSU" == "true" ]]; then
          device_defconfig="arch/arm64/configs/${{ inputs.DEFCONFIG }}"
          curl -LSs "https://raw.githubusercontent.com/RapliVx/KernelSU/xxksu/kernel/setup.sh" | bash -s "${{ inputs.KSU_BRANCH }}"
          
          echo "CONFIG_KSU=y" >> $device_defconfig
          echo "CONFIG_KPROBES=n" >> $device_defconfig
          echo "CONFIG_KSU_DEBUG=n" >> $device_defconfig
          echo "CONFIG_KSU_TOOLKIT=n" >> $device_defconfig
          echo "CONFIG_KSU_EXTRAS=n" >> $device_defconfig
          echo "CONFIG_KSU_TAMPER_SYSCALL_TABLE=y" >> $device_defconfig
          
          if ! grep -q "CONFIG_KSU_TAMPER_SYSCALL_TABLE" "$device_defconfig"; then
            echo "Bail! Failed to append defconfig"
            exit 1
          fi
        fi
        bash ../build.sh

    - name: Upload kernel artifacts
      uses: actions/upload-artifact@v5
      with:
        name: Kernel-${{ steps.buildKernel.outputs.buildDetails }}
        path: |
          kernel_root/out/arch/arm64/boot/Image.gz
          kernel_root/out/.config
          
